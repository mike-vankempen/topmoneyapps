<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0f0e"/>
      <stop offset="100%" style="stop-color:#111712"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <clipPath id="roundedClip">
      <rect width="400" height="400" rx="64" ry="64"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="64" ry="64" fill="url(#bgGrad)"/>

  <!-- Subtle green top bar accent -->
  <rect x="0" y="0" width="400" height="4" rx="0" fill="url(#greenGrad)" clip-path="url(#roundedClip)"/>

  <!-- Green glow circle behind icon -->
  <circle cx="200" cy="148" r="52" fill="#22c55e" opacity="0.08"/>

  <!-- Upward arrow / chart icon -->
  <!-- Bar chart bars -->
  <rect x="148" y="168" width="20" height="32" rx="4" fill="#22c55e" opacity="0.4"/>
  <rect x="176" y="148" width="20" height="52" rx="4" fill="#22c55e" opacity="0.7"/>
  <rect x="204" y="128" width="20" height="72" rx="4" fill="#22c55e"/>
  <!-- Upward tick arrow on top of tallest bar -->
  <polyline points="214,118 214,106 222,114" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "Top" text -->
  <text x="200" y="238"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="600"
    letter-spacing="6"
    fill="#94a3b8"
    text-anchor="middle"
    dominant-baseline="auto">TOP</text>

  <!-- "Money" text — large, bold, green -->
  <text x="200" y="294"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="62"
    font-weight="900"
    letter-spacing="-2"
    fill="#22c55e"
    text-anchor="middle"
    dominant-baseline="auto">Money</text>

  <!-- "Apps" text -->
  <text x="200" y="336"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="600"
    letter-spacing="8"
    fill="#94a3b8"
    text-anchor="middle"
    dominant-baseline="auto">APPS</text>

  <!-- Bottom green dot row -->
  <circle cx="185" cy="364" r="3" fill="#22c55e" opacity="0.4"/>
  <circle cx="200" cy="364" r="3" fill="#22c55e" opacity="0.8"/>
  <circle cx="215" cy="364" r="3" fill="#22c55e" opacity="0.4"/>
</svg>
