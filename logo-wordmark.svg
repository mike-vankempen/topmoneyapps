<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0f0e"/>
      <stop offset="100%" style="stop-color:#111712"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" rx="20" ry="20" fill="url(#bgGrad)"/>

  <!-- Left green accent bar -->
  <rect x="0" y="0" width="5" height="200" rx="0" fill="url(#greenGrad)"/>

  <!-- Icon: mini bar chart -->
  <rect x="52" y="102" width="11" height="22" rx="3" fill="#22c55e" opacity="0.4"/>
  <rect x="68" y="88"  width="11" height="36" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect x="84" y="72"  width="11" height="52" rx="3" fill="#22c55e"/>
  <!-- Arrow tick -->
  <polyline points="89,66 89,56 97,63" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark: Top + Money + Apps -->
  <!-- "Top" -->
  <text x="116" y="116"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="800"
    letter-spacing="-1"
    fill="#f0f4f1"
    dominant-baseline="auto">Top</text>

  <!-- "Money" in green -->
  <text x="228" y="116"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="900"
    letter-spacing="-1"
    fill="#22c55e"
    dominant-baseline="auto">Money</text>

  <!-- "Apps" -->
  <text x="498" y="116"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="800"
    letter-spacing="-1"
    fill="#f0f4f1"
    dominant-baseline="auto">Apps</text>

  <!-- Tagline -->
  <text x="116" y="148"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="14"
    font-weight="500"
    letter-spacing="2.5"
    fill="#64748b"
    dominant-baseline="auto">RANKED · REVIEWED · UPDATED 2026</text>

  <!-- Thin green underline under wordmark -->
  <rect x="116" y="124" width="268" height="2" rx="1" fill="#22c55e" opacity="0.25"/>
</svg>
